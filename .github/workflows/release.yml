name: Release

run-name: Release ${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to release (e.g., 1.2.3, 1.2.3a1 or 1.2.3rc1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  REGISTRY_IMAGE: artefactual/aipscan

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is-prerelease: ${{ steps.validate.outputs.is-prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/validate-pep440-version
      - name: Validate PEP 440 version
        id: validate
        uses: $/.github/actions/validate-pep440-version
        with:
          version: ${{ github.event.inputs.version }}

  build:
    name: Build Python packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    needs: validate-version
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Create local release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: git tag -- "$RELEASE_VERSION"
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: latest
      - name: Build package
        run: uv build
      - name: Save distribution directory
        uses: actions/upload-artifact@v7.0.2
        with:
          # We expect:
          # - dist/aipscan-[version].tar.gz
          # - dist/aipscan-[version]-py3-none-any.whl
          name: dist
          path: dist
          if-no-files-found: error

  verify:
    name: Verify release on ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
      - name: Verify the release wheel and image
        run: bash tests/e2e/check.sh --distribution=dist --indexed=true
      - name: Save acceptance test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-tests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: output/e2e
          if-no-files-found: warn

  pypi:
    name: Publish Python packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: verify
    environment: pypi
    permissions:
      contents: read
      id-token: write # Sign attestations and authenticate to PyPI with OIDC.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Generate PyPI attestations
        run: uv run --locked --only-group publish python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
      - name: Upload distribution packages to PyPI
        run: uv publish --trusted-publishing always

  tag:
    name: Push tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: pypi
    permissions:
      contents: write # Push the release tag after PyPI publication.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag -- "$RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

  image-build:
    name: Build Docker images
    timeout-minutes: 30
    permissions:
      contents: read
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read Python version
        id: python-version
        run: |
          python_version="$(tr -d '\n' < .python-version)"
          echo "value=${python_version}" >> "$GITHUB_OUTPUT"
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false
      - name: Derive platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          target: release
          build-args: |
            PYTHON_VERSION=${{ steps.python-version.outputs.value }}
            WHEEL=aipscan-${{ github.event.inputs.version }}-py3-none-any.whl
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: Publish Docker manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    needs: [image-build, validate-version]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            ${{ github.event.inputs.version }}
            ${{ needs.validate-version.outputs.is-prerelease == 'true' && 'pre' || 'latest' }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$RELEASE_VERSION"

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [image-merge, validate-version]
    permissions:
      contents: write # Create the GitHub release and generate its release notes.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Create GitHub Release
        uses: $/.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event.inputs.version }}
          title: ${{ github.event.inputs.version }}
          prerelease: ${{ needs.validate-version.outputs.is-prerelease }}
