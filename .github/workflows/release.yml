name: Release

run-name: Release ${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PEP 440 version to release (e.g., 1.2.3, 1.2.3a1 or 1.2.3rc1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: artefactual/aipscan

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      is-prerelease: ${{ steps.validate.outputs.is-prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/actions/validate-pep440-version
      - name: Validate PEP 440 version
        id: validate
        uses: $/.github/actions/validate-pep440-version
        with:
          version: ${{ github.event.inputs.version }}

  build:
    name: Build Python packages
    runs-on: ubuntu-24.04
    needs: validate-version
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Create local release tag
        run: git tag ${{ github.event.inputs.version }}
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          version: latest
      - name: Build package
        run: uv build
      - name: Save distribution directory
        uses: actions/upload-artifact@v7.0.2
        with:
          # We expect:
          # - dist/aipscan-[version].tar.gz
          # - dist/aipscan-[version]-py3-none-any.whl
          name: dist
          path: dist

  verify:
    name: Verify release on ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
      - name: Verify the release wheel and image
        run: bash tests/e2e/check.sh --distribution=dist --indexed=true
      - name: Save acceptance test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-tests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: output/e2e
          if-no-files-found: warn

  pypi:
    name: Publish Python packages
    runs-on: ubuntu-24.04
    needs: [build, verify]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: Generate PyPI attestations
        run: uv run --locked --only-group publish python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
      - name: Upload distribution packages to PyPI
        run: uv publish --trusted-publishing always

  tag:
    name: Push tag
    runs-on: ubuntu-24.04
    needs: pypi
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Push release tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin refs/tags/${{ github.event.inputs.version }}

  image-build:
    name: Build Docker images
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Read Python version
        id: python-version
        run: |
          python_version="$(tr -d '\n' < .python-version)"
          echo "value=${python_version}" >> "$GITHUB_OUTPUT"
      - name: Restore distribution directory
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Derive platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          target: release
          build-args: |
            PYTHON_VERSION=${{ steps.python-version.outputs.value }}
            WHEEL=aipscan-${{ github.event.inputs.version }}-py3-none-any.whl
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-merge:
    name: Publish Docker manifests
    runs-on: ubuntu-24.04
    needs: [image-build, validate-version]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            ${{ github.event.inputs.version }}
            ${{ needs.validate-version.outputs.is-prerelease == 'true' && 'pre' || 'latest' }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.event.inputs.version }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: [image-merge, validate-version]
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create GitHub Release
        uses: $/.github/actions/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.event.inputs.version }}
          title: ${{ github.event.inputs.version }}
          prerelease: ${{ needs.validate-version.outputs.is-prerelease }}
