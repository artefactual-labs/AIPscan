---
name: "Test"
on:
  pull_request:
  push:
    branches:
      - "main"
jobs:
  verify-actions-lock:
    name: Verify action lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0
      - name: Verify locked dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  e2e:
    name: "End-to-end reports (indexed=${{ matrix.indexed }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        indexed: [false, true]
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7.0.1
      - name: "Install Dagger"
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.11"
      - name: "Run Dagger end-to-end tests"
        run: bash tests/e2e/check.sh --indexed=${{ matrix.indexed }}
      - name: "Save acceptance test artifacts"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: acceptance-tests-indexed-${{ matrix.indexed }}
          path: output/e2e
          if-no-files-found: warn
  tox:
    name: "Test ${{ matrix.toxenv }}"
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toxenv:
          - "3.15t"
          - "3.15"
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7.0.1
      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.3.2
      - name: "Install Node.js"
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: "Install OS packages"
        run: |
          sudo apt-get --quiet update
          sudo apt-get install --quiet --yes build-essential libxml2-dev libxslt1-dev
      - name: "Start integration services"
        run: |
          docker compose up --detach --wait --wait-timeout 180 --no-deps aipscan-mysql
      - name: "Run tox"
        run: make test TOXENV="${{ matrix.toxenv }}" PYTESTARGS="--cov AIPscan --cov-config .coveragerc --cov-report xml:coverage.xml"
      - name: "Upload coverage report"
        if: ${{ github.repository == 'artefactual-labs/AIPscan' && !contains(github.event.head_commit.message, '[skip codecov]') && !contains(github.event.head_commit.message, '[skip-codecov]') }}
        uses: codecov/codecov-action@v7.1.1
        env:
          CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true
          name: ${{ matrix.toxenv }}
          flags: ${{ matrix.toxenv }}
      - name: "Stop integration services"
        if: ${{ always() }}
        run: |
          docker compose down --volumes
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7.0.1
      - name: "Install uv"
        uses: astral-sh/setup-uv@v10.3.2
      - name: "Install Node.js"
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: "Install frontend tools"
        run: npm ci
      - name: "Run linters"
        run: make lint
  migration-check:
    name: "Migration drift"
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7.0.1
      - name: "Start MySQL"
        run: docker compose up --detach --wait --wait-timeout 180 --no-deps aipscan-mysql
      - name: "Upgrade and check migrations"
        run: docker compose run --rm --no-deps aipscan-migrate bash -c "flask db upgrade && flask db check"
      - name: "Tear down services"
        if: ${{ always() }}
        run: docker compose down --volumes
