profile: pedantic
rules:
  # gh actions-lock --verify enforces the pins in actions.lock.
  unpinned-uses: off
ignores:
  - rule: secrets-outside-env
    file: .github/workflows/generate-sbom.yml
    job: upload
    step: Upload to Dependency-Track
    reason: SBOM uploads share the repository or organization secrets used by the other Dependency-Track integrations.
  - rule: secrets-outside-env
    file: .github/workflows/release.yml
    job: sbom
    reason: The reusable SBOM workflow receives only the two Dependency-Track secrets.
  - rule: secrets-outside-env
    file: .github/workflows/test.yml
    job: tox
    step: Upload coverage report
    reason: Coverage uploads use the existing repository token on pull requests.
  - rule: secrets-outside-env
    file: .github/workflows/release.yml
    job: image-build
    step: Login to Docker Hub
    reason: Docker Hub credentials are existing repository secrets; moving them requires repository administration.
  - rule: secrets-outside-env
    file: .github/workflows/release.yml
    job: image-merge
    step: Login to Docker Hub
    reason: Docker Hub credentials are existing repository secrets; moving them requires repository administration.
